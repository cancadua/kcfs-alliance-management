# Weekly backup of the Neon database, kept as a workflow artifact for 90 days.
#
# The repository is public, so artifacts can be downloaded by any signed-in GitHub user. Backups are therefore
# encrypted with age to a PUBLIC key: GitHub never holds anything that can decrypt them, and a leaked secret or a
# compromised workflow cannot read old backups. The private key stays offline with the owner.
#
# Setup:
#   secrets.DATABASE_URL         postgresql://backup_ro:...@host/db?sslmode=require (a read-only role)
#   vars.BACKUP_AGE_RECIPIENT    age public key (age1...), from `age-keygen`
#
# Restore (needs the private key file):
#   age -d -i kcfs-backup-key.txt -o kcfs.dump kcfs-<date>.dump.age
#   pg_restore --no-owner --no-privileges -d "<target database url>" kcfs.dump
#
# Shared Uncharted Waters maps are anonymous and expire after hours, so only their table schema is backed up.
name: DB backup

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Client must be at least as new as the server; alpine keeps the pull small.
      PG_IMAGE: postgres:18-alpine
    steps:
      - name: Install age
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends age

      - name: Dump, verify and encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          if [[ "$RECIPIENT" != age1* ]]; then
            echo "::error::Set the BACKUP_AGE_RECIPIENT repository variable to an age public key (age1...)."
            exit 1
          fi

          # The plain dump lives only in RAM (/dev/shm) and is removed even if a step fails.
          work=/dev/shm/kcfs-backup
          mkdir -m 700 "$work"
          trap 'rm -rf "$work"' EXIT
          as_runner=(--user "$(id -u):$(id -g)")

          # The URL is read inside the container, so it never appears in a command line.
          docker run --rm "${as_runner[@]}" -e DATABASE_URL -v "$work:/out" "$PG_IMAGE" \
            sh -c 'pg_dump "$DATABASE_URL" -Fc --no-owner --no-privileges \
              --exclude-table-data="\"SharedMaps\"" -f /out/kcfs.dump'

          # A dump that cannot be read back, or lacks the core table, is not a backup: fail loudly.
          docker run --rm "${as_runner[@]}" -v "$work:/out:ro" "$PG_IMAGE" \
            pg_restore --list /out/kcfs.dump > "$work/toc.txt"
          if ! grep -qE 'TABLE DATA public "?Users"? ' "$work/toc.txt"; then
            echo "::error::The dump has no data for the Users table."
            exit 1
          fi

          name="kcfs-$(date -u +%Y-%m-%d).dump.age"
          age -r "$RECIPIENT" -o "$name" "$work/kcfs.dump"
          echo "BACKUP_FILE=$name" >> "$GITHUB_ENV"
          echo "Encrypted backup: $name ($(stat -c %s "$name") bytes, $(grep -c 'TABLE DATA' "$work/toc.txt") tables)"

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
          # Encrypted data does not compress.
          compression-level: 0
          if-no-files-found: error
